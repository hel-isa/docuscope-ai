version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps) actions"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps) npm"
    labels:
      - dependencies
      - javascript
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps) pip"
    labels:
      - dependencies
      - python
    open-pull-requests-limit: 5
