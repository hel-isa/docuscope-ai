[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docuscope-ai"
version = "0.1.0"
description = "Privacy-first hybrid AI document fingerprinting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "He-Isa"}
]
keywords = [
    "documents",
    "privacy",
    "ai",
    "fingerprinting",
    "ocr",
    "document-intelligence",
    "pii-detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "PyPDF2>=3.0.0,<4.0.0",
    "python-docx>=0.8.11,<1.0.0",
    "openpyxl>=3.9.0,<4.0.0",
    "Pillow>=9.0.0,<10.0.0",
    "pytesseract>=0.3.10,<1.0.0",
    "streamlit>=1.20.0,<2.0.0",
    "pandas>=1.5.0,<3.0.0",
    "numpy>=1.23.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8.0",
    "pytest-cov>=4.0,<5.0",
    "flake8>=5.0,<6.0",
    "black>=23.0,<24.0",
    "mypy>=1.0,<3.0",
    "isort>=5.0,<6.0",
    "bandit[toml]>=1.7,<2.0",
]

[project.urls]
Homepage = "https://github.com/hel-isa/docuscope-ai"
Documentation = "https://github.com/hel-isa/docuscope-ai"
Repository = "https://github.com/hel-isa/docuscope-ai.git"
"Bug Tracker" = "https://github.com/hel-isa/docuscope-ai/issues"
"Source Code" = "https://github.com/hel-isa/docuscope-ai"

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [".venv", "venv", ".git"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = [
    "tests/",
    "venv/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "pytesseract.*",
    "openpyxl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
addopts = "--strict-markers -v --tb=short"
markers = [
    "slow: marks tests as slow",
    "privacy: marks tests for privacy module",
    "parser: marks tests for parser module",
    "ocr: marks tests for OCR functionality",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["/tests/", "/test/"]
skips = [
    # Intentional: reading potentially untrusted documents is the purpose
    "B101",  # assert_used
]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/tests.py"]
